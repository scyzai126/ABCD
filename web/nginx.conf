server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The app is client-routed, so unknown paths fall through to index.html
    # rather than 404ing (/studies/1 is a route, not a file).
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Exports stream row by row; buffering would hold the whole file first.
        proxy_buffering off;
    }
}
